replicaCount: 1  # Impostato a 1 come richiesto

image:
  repository: michela877/esame1
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: NodePort
  port: 21000
  targetPort: 21000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

mysql:
  host: mysql-service.kyratech-prova.svc.cluster.local
  port: 3306
  user: root
  password: my-secret-pw
  database: asset_management

command: ["gunicorn", "--bind", "0.0.0.0:21000", "--workers", "3", "app:app"]

readinessProbe:
  httpGet:
    path: /
    port: 21000
  initialDelaySeconds: 10
  periodSeconds: 5

livenessProbe:
  httpGet:
    path: /
    port: 21000
  initialDelaySeconds: 15
  periodSeconds: 20
